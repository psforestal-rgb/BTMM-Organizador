name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  cliente-pruebas:
    name: Cliente — typecheck, lint, unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run

  cliente-build:
    name: Cliente — build
    runs-on: ubuntu-latest
    needs: cliente-pruebas
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build

  servidor-pruebas:
    name: Servidor — pytest + cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check geo tests
      - run: python -m pytest -q --cov=geo --cov-report=term-missing --cov-fail-under=80

  e2e:
    name: End-to-end — Playwright (cliente + servidor real)
    runs-on: ubuntu-latest
    needs: [cliente-pruebas, servidor-pruebas]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias del cliente
        working-directory: app
        run: npm ci
      - name: Instalar navegador de Playwright
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Compilar el cliente
        working-directory: app
        run: npm run build
      - name: Preparar el entorno virtual del servidor
        working-directory: server
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -r requirements-dev.txt
      - name: Escenario canónico y demás pruebas end-to-end
        working-directory: app
        run: npx playwright test
